<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12aaf2"><meta name="apple-mobile-web-app-capable" content="yes"><title>Go Fetch, Charlie! — Happy Apper</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;font-family:system-ui,-apple-system,sans-serif;color:#082c72}body{min-height:100dvh}.app{width:calc(100% - 24px);max-width:520px;aspect-ratio:854/1842;position:relative;margin:0 auto;background:url('approved-artwork.png') center/100% 100% no-repeat;overflow:hidden}/* Mask only the old rounded panel printed into the approved artwork. */
.app::before{content:"";position:absolute;left:2.5%;right:2.5%;top:21.8%;height:29.4%;background:linear-gradient(90deg,#05bdfd 0%,#08bbfb 50%,#04b9fa 100%);pointer-events:none}
button{cursor:pointer}.hit{position:absolute;border:0;background:transparent;color:transparent;font-size:0;touch-action:manipulation}.hit:focus-visible{outline:3px solid #ffbb00;outline-offset:-2px}.gear{left:3.8%;top:3.5%;width:12%;height:7%}.help{right:3.8%;top:3.5%;width:12%;height:7%}.ball{left:72%;top:79%;width:15%;height:7%}.send{left:19%;top:50.1%;width:62%;height:6%}.photos{left:4.5%;top:90%;width:43%;height:7%}.files{right:4.5%;top:90%;width:43%;height:7%}
.entry{position:absolute;left:4.5%;top:22.9%;width:91%;height:26.0%;background:#fff;border:0;border-radius:0;resize:none;outline:0;padding:1.3% 1.5%;font:500 clamp(14px,2.45vw,20px)/1.45 system-ui,-apple-system,sans-serif;color:#123669;overflow:auto}.entry::placeholder{color:#7793b1;opacity:1}.entry:focus{outline:2px solid #0d67be;outline-offset:-3px}.toast{position:absolute;left:8%;right:8%;bottom:10%;padding:12px;background:#fff;border:2px solid #1673c6;border-radius:14px;font-size:15px;text-align:center;box-shadow:0 4px 16px #124c7b55;display:none;z-index:8}.toast.show{display:block}.dialog{position:absolute;inset:0;background:#003d7899;z-index:10;display:none;align-items:center;justify-content:center;padding:6%}.dialog.show{display:flex}.panel{background:white;border-radius:18px;padding:18px;width:100%;max-height:85%;overflow:auto;box-shadow:0 8px 24px #1235}.panel h2{font-size:20px;margin:0 0 12px}.panel p,.panel li{font-size:15px;line-height:1.45}.panel button{background:#126eb7;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700;margin:4px}.panel .close{background:#536579}.item{border-bottom:1px solid #cbdbea;padding:9px 0;overflow-wrap:anywhere}.item button{font-size:13px}.app input[type=file]{display:none}@media(min-width:700px){body{padding:16px}.app{box-shadow:0 6px 25px #005ba866}.entry{font-size:18px}}@media(max-width:430px){.entry{font-size:clamp(15px,4.5vw,20px)}}
</style><link rel="icon" type="image/x-icon" href="/charlie.ico"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="manifest" href="/manifest.webmanifest"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script></head><body><main class="app" aria-label="Go Fetch Charlie app"><button class="hit gear" id="gear" aria-label="Settings">Settings</button><button class="hit help" id="help" aria-label="Help">Help</button><textarea class="entry" id="speech" aria-label="Speak or type to Charlie" placeholder="Tap here to speak or type" spellcheck="true"></textarea><button class="hit send" id="send" aria-label="Send to Charlie">Send to Charlie</button><button class="hit ball" id="ball" aria-label="Open keyboard for dictation">Microphone</button><button class="hit photos" id="photos" aria-label="Catalogue Photos">Catalogue Photos</button><button class="hit files" id="files" aria-label="Catalogue Files">Catalogue Files</button><input type="file" id="photoPicker" accept="image/*,video/*" multiple><input type="file" id="filePicker" multiple><div class="toast" id="toast" role="status"></div><div class="dialog" id="dialog" role="dialog" aria-modal="true"><section class="panel" id="panel"></section></div></main><script>
const $=id=>document.getElementById(id);const entry=$('speech');let selected=[];let notes=[];try{notes=JSON.parse(localStorage.getItem('charlie-notes')||'[]')}catch{};function notify(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>el.classList.remove('show'),4300)}function close(){ $('dialog').classList.remove('show');$('panel').replaceChildren()}function panel(title){let p=$('panel');p.replaceChildren();let h=document.createElement('h2');h.textContent=title;p.append(h);$('dialog').classList.add('show');return p}function addText(p,t){let x=document.createElement('p');x.textContent=t;p.append(x)}function btn(p,label,fn,cls=''){let b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;p.append(b);return b}function finish(p){btn(p,'Close',close,'close')};$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))close()});
$('ball').onclick=()=>{entry.focus();notify('Keyboard ready. Tap the microphone on your Apple keyboard to dictate.')};$('send').onclick=async()=>{let s=entry.value.trim();if(!s){entry.focus();notify('Type or dictate a message first.');return}if(selected.some(x=>x.kind==='file') && /receipt|invoice|printer|ink|bought|purchase|fetch|find/i.test(s)){
 let tokens=s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!['charlie','fetch','find','receipt','receipts','please','bought','the','for','from','look','my','that','show','where'].includes(w));
 let ranked=selected.filter(x=>x.kind==='file').map(x=>({x,score:tokens.reduce((v,w)=>v+((x.searchText||x.file.name).toLowerCase().includes(w)?1:0),0)})).sort((a,b)=>b.score-a.score);
 let p=panel('Charlie found these receipts');
 if(!tokens.length)addText(p,'Tell me an item, shop, or amount to narrow down the results.');
 else addText(p,ranked[0]?.score?'Best matches for: '+tokens.join(', '):'No exact match found. Here are the receipts you selected.');
 (ranked[0]?.score?ranked.filter(v=>v.score>0):ranked).forEach(({x,score})=>{
 let d=document.createElement('div');d.className='item';d.textContent=x.file.name+(score?' — '+score+' matching clue(s)':'');p.append(d);
 btn(d,'Open receipt',()=>{const u=URL.createObjectURL(x.file);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)});
 });finish(p);return;
 }let send=$('send');send.disabled=true;notify('Charlie is thinking…');try{let r=await fetch('/.netlify/functions/charlie-ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:s})});let data=await r.json();if(!r.ok)throw Error(data.error||'AI connection unavailable');notes.unshift({text:s,date:new Date().toLocaleString(),reply:data.reply});notes=notes.slice(0,100);try{localStorage.setItem('charlie-notes',JSON.stringify(notes))}catch{}entry.value='';let p=panel('Charlie replies');addText(p,data.reply);finish(p)}catch(e){let p=panel('Charlie connection');addText(p,e.message);addText(p,'The AI needs a server-side API key configured in Netlify. Your message has not been sent successfully.');finish(p)}finally{send.disabled=false}};$('photos').onclick=()=>$('photoPicker').click();$('files').onclick=()=>$('filePicker').click();async function readReceipt(x){
 x.searchText=x.file.name;
 if(x.file.type==='application/pdf'||/\.pdf$/i.test(x.file.name)){
   if(!window.pdfjsLib){x.searchText+=' PDF text reader unavailable';return}
   try{
     const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await x.file.arrayBuffer()),disableWorker:true}).promise;
     let chunks=[];
     for(let i=1;i<=Math.min(pdf.numPages,5);i++){
       let page=await pdf.getPage(i), content=await page.getTextContent();
       chunks.push(content.items.map(t=>t.str).join(' '));
     }
     x.searchText+=' '+chunks.join(' ');
   }catch(e){x.searchText+=' PDF reading failed'}
 }else if(x.file.type.startsWith('text/')){try{x.searchText+=' '+(await x.file.text()).slice(0,50000)}catch(e){}}
}
async function picked(input,kind){const a=[...input.files];if(!a.length)return;let incoming=a.map(f=>({file:f,kind}));selected.push(...incoming);input.value='';notify('Reading selected receipts…');if(kind==='file')await Promise.all(incoming.map(readReceipt));showCatalogue(kind)}function showCatalogue(kind){let a=selected.filter(x=>x.kind===kind);let p=panel(kind==='photo'?'Catalogue Photos':'Catalogue Files');addText(p,`${a.length} item(s) selected for this session. Search their printed text by typing a description and pressing Send to Charlie. Files stay on this device and are not uploaded.`);a.forEach(x=>{let d=document.createElement('div');d.className='item';d.textContent=x.file.name+' ('+Math.round(x.file.size/1024)+' KB)';p.append(d);btn(d,'Open',()=>{let url=URL.createObjectURL(x.file);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000)})});btn(p,'Add more',()=>{close();$(kind==='photo'?'photoPicker':'filePicker').click()});finish(p)}$('photoPicker').onchange=()=>picked($('photoPicker'),'photo');$('filePicker').onchange=()=>picked($('filePicker'),'file');$('help').onclick=()=>{let p=panel('How to use Charlie');addText(p,'Tap the beach ball to open the keyboard, then tap the Apple keyboard microphone to dictate. You can also tap the white writing area to type.');addText(p,'Send to Charlie sends your message to the AI service when configured. Catalogue buttons select files and photos for this session. AI conversation is available after server configuration. Receipt searching works after you select text-based PDFs with Catalogue Files. Scanned image receipts are not yet supported.');finish(p)};$('gear').onclick=()=>{let p=panel("Charlie's tools");
addText(p,'Choose a tool. Charlie will ask permission before accessing your files.');
btn(p,'📷 Catalogue photos',()=>{close();$('photoPicker').click()});
btn(p,'📁 Catalogue files',()=>{close();$('filePicker').click()});
btn(p,'⌨️ Type instead',()=>{close();entry.focus()});
btn(p,'🚗 My parking spot',()=>{p=panel('My parking spot');addText(p,'Save a description of where you parked, then ask Charlie to remind you.');let field=document.createElement('textarea');field.placeholder='Example: Level 3, row B, near the lift';field.style.cssText='width:100%;min-height:90px;font:18px sans-serif;padding:12px;box-sizing:border-box';field.value=localStorage.getItem('charlie-parking')||'';p.append(field);btn(p,'Save parking spot',()=>{localStorage.setItem('charlie-parking',field.value.trim());notify('Parking spot saved on this device.');close()});finish(p)});
btn(p,'🧠 My memories',()=>{p=panel('My memories');addText(p,`${notes.length} saved message(s) on this device.`);notes.forEach(n=>{let d=document.createElement('div');d.className='item';d.textContent=n.date+': '+n.text+(n.reply?' — Charlie: '+n.reply:'');p.append(d)});if(!notes.length)addText(p,'No saved messages yet.');let park=localStorage.getItem('charlie-parking');if(park)addText(p,'Parking spot: '+park);finish(p)});
btn(p,'🐾 Change assistant',()=>{p=panel('Change assistant');addText(p,'Charlie is the active assistant. Additional characters are not available in this test version.');finish(p)});
btn(p,'🗑️ Clear saved messages',()=>{if(confirm('Delete saved messages on this device?')){notes=[];localStorage.removeItem('charlie-notes');close();notify('Saved messages cleared.')}});
finish(p)};
</script></body></html>
