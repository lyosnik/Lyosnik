</style><link rel="icon" type="image/x-icon" href="/charlie.ico"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="manifest" href="/manifest.webmanifest"></head><body><main class="app" aria-label="Go Fetch Charlie app"><button class="hit gear" id="gear" aria-label="Settings">Settings</button><button class="hit help" id="help" aria-label="Help">Help</button><textarea class="entry" id="speech" aria-label="Speak or type to Charlie" placeholder="Tap here to speak or type" spellcheck="true"></textarea><button class="hit send" id="send" aria-label="Send to Charlie">Send to Charlie</button><button class="hit ball" id="ball" aria-label="Open keyboard for dictation">Microphone</button><button class="hit photos" id="photos" aria-label="Catalogue Photos">Catalogue Photos</button><button class="hit files" id="files" aria-label="Catalogue Files">Catalogue Files</button><input type="file" id="photoPicker" accept="image/*" multiple><input type="file" id="filePicker" accept=".pdf,.docx,.xlsx,.pptx,.txt,.csv,.md,.rtf,.odt,.ods,.json" multiple><div class="toast" id="toast" role="status"></div><div class="dialog" id="dialog" role="dialog" aria-modal="true"><section class="panel" id="panel"></section></div></main><script>
const $=id=>document.getElementById(id);const entry=$('speech');let selected=[];let previewURL;let notes=[];try{notes=JSON.parse(localStorage.getItem('charlie-notes')||'[]')}catch{};function notify(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>el.classList.remove('show'),4300)}function clearPreview(){if(previewURL){URL.revokeObjectURL(previewURL);previewURL=null}}function close(){clearPreview(); $('dialog').classList.remove('show');$('panel').replaceChildren()}function panel(title){clearPreview();let p=$('panel');p.replaceChildren();let h=document.createElement('h2');h.textContent=title;p.append(h);$('dialog').classList.add('show');return p}function addText(p,t){let x=document.createElement('p');x.textContent=t;p.append(x)}function btn(p,label,fn,cls=''){let b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;p.append(b);return b}function finish(p){btn(p,'Close',close,'close')};$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))close()});
$('ball').onclick=()=>{entry.focus();notify('Keyboard ready. Tap the microphone on your Apple keyboard to dictate.')};let catalogueConsent = false;
let previousSearch = '';
const maxSearchItems = 24;

function readAsDataURL(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

async function photoPreview(file) {
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const scale = Math.min(1, 512 / Math.max(image.width, image.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.width * scale));
    canvas.height = Math.max(1, Math.round(image.height * scale));
    const context = canvas.getContext('2d');
    context.fillStyle = '#fff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.65);
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function describeItem(item, id) {
  const {file, kind} = item;
  const description = {id, name: file.name, kind};
  try {
    if (kind === 'photo') description.image = await photoPreview(file);
    else if (/\.(txt|csv|md|json)$/i.test(file.name)) {
      description.text = await file.slice(0, 6000).text();
    } else if (/\.pdf$/i.test(file.name) && file.size <= 200000) {
      description.pdf = (await readAsDataURL(new Blob([file], {type:'application/pdf'})));
    }
  } catch {
    // The filename is still available if the contents cannot be read.
  }
  return description;
}

function showResult(item) {
  const p = panel(item.file.name);
  if (item.kind === 'photo') {
    previewURL = URL.createObjectURL(item.file);
    const image = document.createElement('img');
    image.src = previewURL;
    image.alt = item.file.name;
    image.style.maxWidth = '100%';
    p.append(image);
  }
  btn(p, 'Open', () => {
    const opened = URL.createObjectURL(item.file);
    window.open(opened, '_blank', 'noopener');
    setTimeout(() => URL.revokeObjectURL(opened), 60000);
  });
  finish(p);
}

$('send').onclick = async () => {
  const message = entry.value.trim();
  if (!message) {
    entry.focus();
    notify('Type or dictate a message first.');
    return;
  }
  if (selected.length && !catalogueConsent) {
    catalogueConsent = confirm('Allow Charlie to send small previews of your selected photos, filenames, text excerpts and small PDFs to the AI service for this session?');
    if (!catalogueConsent) return;
  }
  const send = $('send');
  send.disabled = true;
  notify('Charlie is thinking…');
  try {
    const items = selected.slice(-maxSearchItems);
    const catalogue = await Promise.all(items.map(describeItem));
    const response = await fetch('/.netlify/functions/charlie-ai', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message, catalogue, previousSearch})
    });
    const data = await response.json();
    if (!response.ok) throw Error(data.error || 'AI connection unavailable');
    previousSearch = data.needsClue ? [previousSearch, message].filter(Boolean).join(' ').slice(-2500) : '';
    notes.unshift({text:message,date:new Date().toLocaleString(),reply:data.reply});
    notes = notes.slice(0,100);
    try { localStorage.setItem('charlie-notes',JSON.stringify(notes)); } catch {}
    entry.value = '';
    if (Number.isInteger(data.matchId) && items[data.matchId]) {
      showResult(items[data.matchId]);
    } else {
      const p = panel('Charlie replies');
      addText(p,data.reply);
      if (selected.length > maxSearchItems) addText(p,'Charlie checked the most recent 24 catalogue items.');
      finish(p);
    }
  } catch (error) {
    const p = panel('Charlie connection');
    addText(p,error.message);
    finish(p);
  } finally {
    send.disabled = false;
  }
};
$('photos').onclick=()=>$('photoPicker').click();$('files').onclick=()=>$('filePicker').click();function picked(input,kind){const a=[...input.files].filter(file=>kind==='photo' ? file.type.startsWith('image/') || /\.(heic|heif|jpg|jpeg|png|webp|gif|avif)$/i.test(file.name) : !/^(image|video)\//.test(file.type));if(!a.length && input.files.length)notify(kind==='photo'?'Choose an image for Catalogue Photos.':'Choose a document for Catalogue Files.');if(!a.length)return;selected.push(...a.map(f=>({file:f,kind})));input.value='';showCatalogue(kind)}function showCatalogue(kind){let a=selected.filter(x=>x.kind===kind);let p=panel(kind==='photo'?'Catalogue Photos':'Catalogue Files');addText(p,`${a.length} item(s) selected for this session. Charlie can search these items after you allow him to share searchable details with the AI service.`);a.forEach(x=>{let d=document.createElement('div');d.className='item';d.textContent=x.file.name+' ('+Math.round(x.file.size/1024)+' KB)';p.append(d);btn(d,'Open',()=>{let url=URL.createObjectURL(x.file);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000)})});btn(p,'Add more',()=>{close();$(kind==='photo'?'photoPicker':'filePicker').click()});finish(p)}$('photoPicker').onchange=()=>picked($('photoPicker'),'photo');$('filePicker').onchange=()=>picked($('filePicker'),'file');$('help').onclick=()=>{let p=panel('How to use Charlie');addText(p,'Tap the beach ball to open the keyboard, then tap the Apple keyboard microphone to dictate. You can also tap the white writing area to type.');addText(p,'Send to Charlie sends your message to the AI service when configured. Catalogue buttons select files and photos for this session. Ask Charlie to find a photo or file by describing it. Catalogue selections last for this session.');finish(p)};$('gear').onclick=()=>{let p=panel("Charlie's tools");
addText(p,'Choose a tool. Charlie will ask permission before accessing your files.');
btn(p,'📷 Catalogue photos',()=>{close();$('photoPicker').click()});
btn(p,'📁 Catalogue files',()=>{close();$('filePicker').click()});
btn(p,'⌨️ Type instead',()=>{close();entry.focus()});
btn(p,'🚗 My parking spot',()=>{p=panel('My parking spot');addText(p,'Save a description of where you parked, then ask Charlie to remind you.');let field=document.createElement('textarea');field.placeholder='Example: Level 3, row B, near the lift';field.style.cssText='width:100%;min-height:90px;font:18px sans-serif;padding:12px;box-sizing:border-box';field.value=localStorage.getItem('charlie-parking')||'';p.append(field);btn(p,'Save parking spot',()=>{localStorage.setItem('charlie-parking',field.value.trim());notify('Parking spot saved on this device.');close()});finish(p)});
btn(p,'🧠 My memories',()=>{p=panel('My memories');addText(p,`${notes.length} saved message(s) on this device.`);notes.forEach(n=>{let d=document.createElement('div');d.className='item';d.textContent=n.date+': '+n.text+(n.reply?' — Charlie: '+n.reply:'');p.append(d)});if(!notes.length)addText(p,'No saved messages yet.');let park=localStorage.getItem('charlie-parking');if(park)addText(p,'Parking spot: '+park);finish(p)});
btn(p,'🐾 Change assistant',()=>{p=panel('Change assistant');addText(p,'Charlie is the active assistant. Additional characters are not available in this test version.');finish(p)});
btn(p,'🗑️ Clear saved messages',()=>{if(confirm('Delete saved messages on this device?')){notes=[];localStorage.removeItem('charlie-notes');close();notify('Saved messages cleared.')}});
finish(p)};
</script></body></html>
